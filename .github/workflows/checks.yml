name: Checks
on: [push, pull_request]
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest -q
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --locked --manifest-path desktop/Cargo.toml
