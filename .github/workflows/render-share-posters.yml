# One-shot helper: re-render assets/share posters with tools/render_share.swift
# on a macOS runner. Removed after the PNGs and catalog hashes are committed.
name: Render share posters
on:
  push:
    paths:
      - tools/render_share.swift
      - .github/workflows/render-share-posters.yml
permissions:
  contents: read
  actions: write
jobs:
  render:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: swift tools/render_share.swift assets
      - run: python3 tools/prepare_share.py
      - run: python3 -c "import hashlib,pathlib; [print(p.name, len(d:=p.read_bytes()), hashlib.sha256(d).hexdigest()) for p in sorted(pathlib.Path('assets/share').glob('*.png'))]"
      - uses: actions/upload-artifact@v4
        with:
          name: share-posters
          path: assets/share/
          if-no-files-found: error
