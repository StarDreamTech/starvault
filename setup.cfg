[metadata]
name = chat-history-vault
version = 0.1.2
url = https://github.com/cpython666/starvault
license = MIT
description = StarVault - local AI conversation archives, backup, migration and MCP
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.9
py_modules =
    chat_history_vault
    vault
    vault_mcp
    archive_api
    resources
    skills_backup
    chatgpt_import
    claude_desktop
    claude_cache
    claude_projects

[options.entry_points]
console_scripts =
    chat-history-vault = chat_history_vault:main
    starvault = chat_history_vault:main

[options.data_files]
share/chat-history-vault/skills/use-chat-history-vault =
    skills/use-chat-history-vault/SKILL.md
share/chat-history-vault/skills/use-chat-history-vault/agents =
    skills/use-chat-history-vault/agents/openai.yaml
