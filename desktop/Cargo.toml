[package]
name = "chat-history-vault"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
description = "StarVault: a local desktop reader for AI conversation archives"

[dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland", "__screenshot"] }
egui_commonmark = "=0.20.0"
egui_extras = { version = "=0.31.1", default-features = false, features = ["image"] }
pulldown-cmark = { version = "=0.12.2", default-features = false }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
rfd = "0.15"
url = "2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
incremental = false
